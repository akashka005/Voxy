version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: voxsentinel_backend
    ports:
      - "8000:8000"
    volumes:
      - ./tmp/audio:/app/tmp/audio
      - voxsentinel_db:/app/db
    environment:
      - APP_ENV=production
      - DATABASE_URL=sqlite:////app/db/voxsentinel.db
      - API_KEY=${API_KEY}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000}
      - DEFAULT_DEVICE=cpu
      - ALLOW_CUDA=false
      - MAX_UPLOAD_MB=25
      - MAX_AUDIO_DURATION_SECONDS=300
      - RETAIN_RAW_AUDIO=false
      - RETAIN_TRANSCRIPTS=false
      - WHISPER_MODEL=base
      - WHISPER_DEVICE=cpu
      - WHISPER_COMPUTE_TYPE=int8
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

volumes:
  voxsentinel_db:
